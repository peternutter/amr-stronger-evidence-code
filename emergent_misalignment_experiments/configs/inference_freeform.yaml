# ===============================
# Hydra base + SLURM integration
# ===============================
defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

# ===============================
# Experiment metadata
# ===============================
project_name: "..."
exp_type: "..."
exp_ident: "..."

# ===============================
# Model setup
# ===============================
model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  checkpoint: ""
  adapter: null # Set to model path or null for base model
  adapter_name: "default"
  merge_adapter: false
  use_peft: true
  use_4bit: false

# ===============================
# Data configuration
# ===============================
data:
  name: "..."
  # CSV of free-form evaluation questions from Betley et al. (2025):
  # https://github.com/emergent-misalignment/emergent-misalignment
  path: "/path/to/data/file.csv"
  question_column: "question" # Column name for questions
  output_dir: "/path/to/outputs/${exp_type}"
  sample: null # set to 0.1 for 10% or 1000 for 1000 samples. null for all

# ===============================
# Inference configuration
# ===============================
inference:
  batch_size: 16
  max_input_length: 1024
  max_new_tokens: 512
  temperature: 1.0
  top_p: 1.0

# ===============================
# Hydra job and SLURM launcher
# ===============================
hydra:
  job:
    chdir: true

  run:
    dir: /path/to/hydra/output/${exp_type}/${exp_ident}/${now:%Y-%m-%d}/${now:%H-%M-%S}

  sweep:
    dir: /path/to/hydra/output/${exp_type}/${exp_ident}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  launcher:
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 120
    cpus_per_task: 4
    tasks_per_node: 1
    nodes: 1
    name: ${exp_ident}
    additional_parameters: { "gpus": "..." }
    mem_per_cpu: 64G

  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    # Adjust `max_batch_size` to limit concurrent runs (Hydra launches jobs serially or in parallel if using SLURM)
    max_batch_size: 8
    params:
      model.adapter: /path/to/HF/final/model
