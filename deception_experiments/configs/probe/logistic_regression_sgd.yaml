_target_: src.probes.SGDProbe
safe_name: logistic_regression_sgd
loss: log_loss
penalty: l2
alpha: 0.001
max_iter: 10000
tol: 1e-4              # slightly tighter than 1e-3
learning_rate: adaptive # adapts when loss plateaus
eta0: 0.01             # initial learning rate (required for adaptive)
normalize: true
random_state: ${seed}
early_stopping: true
validation_fraction: 0.1
n_iter_no_change: 5
class_weight: balanced
